services:
  postgres:
    image: postgres:16-alpine
    container_name: portfolio-cms-postgres
    environment:
      POSTGRES_DB: portfolio_cms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - portfolio-cms-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d portfolio_cms"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  portfolio-cms-postgres-data:
